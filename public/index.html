<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Richard AI Studio Pro</title>
  <style>
    :root {
      --bg: #f4f7ff;
      --bg-2: #ebf0ff;
      --panel: rgba(255,255,255,0.8);
      --panel-strong: #ffffff;
      --primary: #5b4df3;
      --primary-2: #7b68ff;
      --accent: #00c2a8;
      --text: #171d2d;
      --muted: #5f6881;
      --line: #dfe6f5;
      --danger: #d74a4a;
      --success: #129a6c;
      --shadow: 0 20px 50px rgba(48, 58, 110, 0.12);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, "Segoe UI", sans-serif; background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%); color: var(--text); }
    body { min-height: 100vh; }
    button, input, select, textarea { font: inherit; }

    .app-shell { max-width: 1440px; margin: 0 auto; padding: 24px; }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.72); backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.5); border-radius: 18px;
      padding: 16px 20px; box-shadow: var(--shadow); position: sticky; top: 12px; z-index: 10;
    }

    .brand-block { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white; display: grid; place-items: center; font-weight: 700;
      box-shadow: 0 12px 30px rgba(91, 77, 243, 0.35);
    }
    .brand-copy strong { display: block; font-size: 1rem; }
    .brand-copy span { color: var(--muted); font-size: 0.75rem; }

    .main-nav { display: flex; align-items: center; gap: 18px; color: var(--muted); }
    .main-nav a { text-decoration: none; color: inherit; font-weight: 600; }

    .auth-actions { display: flex; align-items: center; gap: 10px; }
    .btn {
      border: 1px solid var(--line); background: white; color: var(--text); border-radius: 12px;
      padding: 10px 16px; font-weight: 700; cursor: pointer; transition: 0.2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary {
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      border-color: transparent; color: white; box-shadow: 0 12px 25px rgba(91, 77, 243, 0.25);
    }
    .btn.ghost { background: transparent; }

    .dashboard {
      display: grid; grid-template-columns: 420px minmax(0, 1fr); gap: 24px; margin-top: 28px;
    }

    .panel {
      background: var(--panel); border: 1px solid rgba(255,255,255,0.7);
      border-radius: var(--radius); box-shadow: var(--shadow);
      padding: 20px;
    }

    .panel-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px;
    }
    .panel-header h2 { margin: 0; font-size: 1.08rem; }
    .tag {
      background: rgba(91, 77, 243, 0.1); color: var(--primary); border-radius: 999px;
      padding: 6px 10px; font-size: 0.74rem; font-weight: 700;
    }

    .field { margin-bottom: 14px; }
    .field label {
      display: block; margin-bottom: 8px; font-size: 0.82rem; font-weight: 700; color: var(--muted);
    }
    .field input, .field select, .field textarea {
      width: 100%; background: rgba(255,255,255,0.7); border: 1px solid var(--line);
      border-radius: 12px; padding: 11px 12px; color: var(--text);
      outline: none; transition: 0.2s ease;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: rgba(91,77,243,0.6); box-shadow: 0 0 0 4px rgba(91,77,243,0.08);
    }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .type-grid {
      display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 10px;
    }
    .type-option {
      position: relative;
    }
    .type-option input { position: absolute; opacity: 0; pointer-events: none; }
    .type-option label {
      display: flex; align-items: center; justify-content: center; min-height: 62px;
      padding: 12px; border-radius: 14px; border: 1px solid var(--line);
      background: rgba(255,255,255,0.7); text-align: center; font-size: 0.83rem; font-weight: 700;
      cursor: pointer; transition: 0.2s ease; margin: 0;
    }
    .type-option input:checked + label {
      background: rgba(91,77,243,0.08); border-color: rgba(91,77,243,0.55); color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(91,77,243,0.15);
    }

    .check-list { display: grid; gap: 10px; margin-top: 10px; }
    .check-item {
      display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.9rem;
    }
    .check-item input { accent-color: var(--primary); }

    .cta-row {
      display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap;
    }

    .content-panel { padding-bottom: 14px; }
    .stats-row {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;
      margin-bottom: 18px;
    }
    .stat-card {
      background: linear-gradient(180deg, rgba(255,255,255,1), rgba(242,246,255,1));
      border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
    }
    .stat-card small { display: block; color: var(--muted); margin-bottom: 8px; }
    .stat-card strong { font-size: 1.6rem; }

    .status-bar {
      min-height: 26px; margin: 10px 0 18px; color: var(--muted); font-size: 0.88rem; font-weight: 600;
    }
    .status-bar.error { color: var(--danger); }
    .status-bar.success { color: var(--success); }

    .output-box {
      background: #101827; color: #ecf4ff; border-radius: 18px; padding: 18px 20px;
      min-height: 260px; line-height: 1.7; white-space: pre-wrap; word-break: break-word;
      font-size: 0.96rem; box-shadow: inset 0 1px 1px rgba(255,255,255,0.05);
    }

    .tool-actions {
      display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0 22px;
    }
    .tool-actions .btn { background: rgba(255,255,255,0.8); }
    .tool-actions .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .library-box {
      border-top: 1px solid var(--line); padding-top: 18px; margin-top: 8px;
    }
    .library-grid {
      display: grid; gap: 12px; margin-top: 16px;
    }
    .project-item {
      background: rgba(255,255,255,0.7); border: 1px solid var(--line); border-radius: 14px;
      padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .project-meta { min-width: 0; }
    .project-meta .title { font-weight: 700; display: block; }
    .project-meta .date { color: var(--muted); font-size: 0.76rem; }
    .project-actions { display: flex; gap: 8px; }
    .mini-btn {
      border: 1px solid var(--line); background: white; border-radius: 10px;
      padding: 8px 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    }

    .modal {
      position: fixed; inset: 0; background: rgba(16,24,39,0.45); display: flex; align-items: center; justify-content: center;
      padding: 20px; z-index: 30; opacity: 0; pointer-events: none; transition: 0.2s ease;
    }
    .modal.open { opacity: 1; pointer-events: auto; }
    .modal-card {
      width: min(460px, 100%); background: white; border-radius: 22px; padding: 22px; box-shadow: var(--shadow);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .close-btn {
      border: 0; background: transparent; color: var(--muted); font-size: 1.5rem; cursor: pointer;
    }
    .hidden { display: none !important; }

    @media (max-width: 980px) {
      .dashboard { grid-template-columns: 1fr; }
      .stats-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }

    @media (max-width: 640px) {
      .app-shell { padding: 14px; }
      .topbar { flex-wrap: wrap; gap: 12px; }
      .main-nav { order: 3; width: 100%; justify-content: space-between; }
      .two-col, .type-grid, .stats-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark">R</div>
        <div class="brand-copy">
          <strong>Richard AI Studio</strong>
          <span>Premium teaching content engine</span>
        </div>
      </div>

      <nav class="main-nav">
        <a href="#">Generate</a>
        <a href="#">Library</a>
        <a href="#">Plans</a>
        <a href="#">Resources</a>
      </nav>

      <div class="auth-actions">
        <button class="btn ghost" id="loginBtn">Login</button>
        <button class="btn primary" id="signupBtn">Get started</button>
      </div>
    </header>

    <main class="dashboard">
      <aside class="panel">
        <div class="panel-header">
          <h2>Create a new resource</h2>
          <span class="tag">Pro</span>
        </div>

        <div class="field">
          <label for="curriculum">Curriculum</label>
          <select id="curriculum"></select>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="grade">Class</label>
            <select id="grade"></select>
          </div>
          <div class="field">
            <label for="subject">Subject</label>
            <select id="subject"></select>
          </div>
        </div>

        <div class="field">
          <label for="topic">Topic / Chapter</label>
          <input id="topic" type="text" placeholder="e.g. Photosynthesis, Tenses, Fractions" />
        </div>

        <div class="field">
          <label>Resource type</label>
          <div class="type-grid" id="types"></div>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="duration">Duration</label>
            <input id="duration" type="number" value="40" min="5" max="180" />
          </div>
          <div class="field">
            <label for="count">Items</label>
            <input id="count" type="number" value="10" min="1" max="50" />
          </div>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="level">Level</label>
            <select id="level">
              <option>Beginner</option>
              <option selected>Intermediate</option>
              <option>Advanced</option>
            </select>
          </div>
          <div class="field">
            <label for="language">Output language</label>
            <select id="language">
              <option>English</option>
              <option>Arabic</option>
              <option>Hindi</option>
              <option>Urdu</option>
              <option>Malayalam</option>
              <option>French</option>
              <option>Spanish</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Smart options</label>
          <div class="check-list">
            <label class="check-item"><input type="checkbox" id="esl" /> ESL support</label>
            <label class="check-item"><input type="checkbox" id="qatar" checked /> Qatar National Values</label>
            <label class="check-item"><input type="checkbox" id="sdg" checked /> UN SDG links</label>
            <label class="check-item"><input type="checkbox" id="exam" /> Exam-style questions</label>
            <label class="check-item"><input type="checkbox" id="answers" checked /> Include answer key</label>
          </div>
        </div>

        <div class="cta-row">
          <button class="btn primary" id="generateBtn">Generate now</button>
          <button class="btn ghost" id="saveProjectBtn">Save draft</button>
        </div>
      </aside>

      <section class="panel content-panel">
        <div class="stats-row">
          <div class="stat-card">
            <small>Projects</small>
            <strong id="statProjects">0</strong>
          </div>
          <div class="stat-card">
            <small>Exports</small>
            <strong id="statExports">0</strong>
          </div>
          <div class="stat-card">
            <small>Avg. time</small>
            <strong>2m</strong>
          </div>
          <div class="stat-card">
            <small>Model</small>
            <strong>Claude</strong>
          </div>
        </div>

        <div id="statusBar" class="status-bar">Ready to generate high-quality teaching resources.</div>

        <div id="output" class="output-box">Your generated content will appear here.</div>

        <div class="tool-actions">
          <button class="btn" id="copyBtn" disabled>Copy</button>
          <button class="btn" id="saveToLibraryBtn" disabled>Save to Library</button>
          <button class="btn" id="docxBtn" disabled>Download DOCX</button>
          <button class="btn" id="pdfBtn" disabled>Print / PDF</button>
        </div>

        <div class="library-box">
          <div class="panel-header" style="margin-bottom: 0;">
            <h2>My library</h2>
            <span class="tag" id="userTag">Guest</span>
          </div>
          <div class="library-grid" id="projectList"></div>
        </div>
      </section>
    </main>
  </div>

  <div id="authModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-header">
        <h2 id="authTitle">Welcome back</h2>
        <button class="close-btn" id="closeAuthBtn" aria-label="Close">×</button>
      </div>

      <div class="field">
        <label for="authName">Full name</label>
        <input id="authName" type="text" placeholder="Teacher name" />
      </div>

      <div class="field">
        <label for="authEmail">Email</label>
        <input id="authEmail" type="email" placeholder="you@example.com" />
      </div>

      <div class="field">
        <label for="authPassword">Password</label>
        <input id="authPassword" type="password" placeholder="••••••••" />
      </div>

      <div class="cta-row" style="margin-top: 10px;">
        <button class="btn primary" id="authSubmitBtn">Continue</button>
        <button class="btn ghost" id="toggleAuthModeBtn">Create account</button>
      </div>
    </div>
  </div>

  <script>
    const CONFIG = {
      endpoint: "/api/generate"
    };

    const CURRICULA = {
      "CBSE (India)": { subjects: ["English","Hindi","Mathematics","Science","Social Science","Computer Science","Sanskrit","Physical Education","Art Education","Other"] },
      "ICSE / CISCE (India)": { subjects: ["English Language","English Literature","Hindi","Mathematics","Physics","Chemistry","Biology","History & Civics","Geography","Computer Applications","Other"] },
      "IGCSE (Cambridge)": { subjects: ["English First Language","English as a Second Language","Mathematics","Physics","Chemistry","Biology","Computer Science","Global Perspectives","Geography","History","Arabic","Other"] },
      "IB (PYP / MYP / DP)": { subjects: ["Language & Literature","Language Acquisition","Mathematics","Sciences","Individuals & Societies","Design","Arts","Physical & Health Education","Theory of Knowledge","Other"] },
      "British (National Curriculum England)": { subjects: ["English","Maths","Science","Computing","History","Geography","Art & Design","Music","Religious Education","Modern Foreign Language","Other"] },
      "American (Common Core / State Standards)": { subjects: ["English Language Arts","Mathematics","Science","Social Studies","Computer Science","World Languages","Health","Other"] },
      "Qatar National Curriculum (MoEHE)": { subjects: ["Arabic Language","Islamic Education","English","Mathematics","Science","Social Studies","Computer Science","Physical Education","Other"] },
      "Custom / Other": { subjects: ["English","Mathematics","Science","Social Studies","Computer Science","Languages","Other"] }
    };

    const RESOURCES = [
      { id: "video", label: "Video Script" },
      { id: "lessonplan", label: "Lesson Plan" },
      { id: "dlp", label: "DLP" },
      { id: "notes", label: "Notes" },
      { id: "worksheet", label: "Worksheet" },
      { id: "qpaper", label: "Question Paper" },
      { id: "flashcards", label: "Flashcards" },
      { id: "rubric", label: "Rubric" },
      { id: "quiz", label: "Quiz" },
      { id: "slides", label: "Slide Outline" }
    ];

    const ESL_FOCUS = ["Phonics", "Grammar", "Vocabulary", "Speaking", "Listening", "Reading comprehension", "Writing"];
    const $ = id => document.getElementById(id);

    const curSel = $("curriculum");
    const gradeSel = $("grade");
    const subSel = $("subject");
    const authModal = $("authModal");
    const authTitle = $("authTitle");
    const authSubmitBtn = $("authSubmitBtn");
    const toggleAuthModeBtn = $("toggleAuthModeBtn");
    const statusBar = $("statusBar");
    const output = $("output");

    let isLoginMode = true;
    let lastResult = null;

    function setStatus(message, type = "") {
      statusBar.textContent = message;
      statusBar.className = "status-bar" + (type ? ` ${type}` : "");
    }

    function renderCurriculumOptions() {
      curSel.innerHTML = "";
      Object.keys(CURRICULA).forEach(cur => {
        curSel.add(new Option(cur, cur));
      });
      for (let g = 1; g <= 12; g++) {
        gradeSel.add(new Option("Class " + g, "Class " + g));
      }
      refreshSubjects();
    }

    function refreshSubjects() {
      const selected = curSel.value || Object.keys(CURRICULA)[0];
      subSel.innerHTML = "";
      CURRICULA[selected].subjects.forEach(subject => {
        subSel.add(new Option(subject, subject));
      });
    }

    function renderResourceTypes() {
      const container = $("types");
      container.innerHTML = "";
      RESOURCES.forEach((r, idx) => {
        const item = document.createElement("div");
        item.className = "type-option";
        item.innerHTML = `
          <input type="radio" name="rtype" id="type-${r.id}" value="${r.id}" ${idx === 0 ? "checked" : ""} />
          <label for="type-${r.id}">${r.label}</label>
        `;
        container.appendChild(item);
      });
    }

    function getCurrentOptions() {
      return {
        curriculum: curSel.value,
        grade: gradeSel.value,
        subject: subSel.value,
        topic: $("topic").value.trim(),
        duration: $("duration").value,
        count: $("count").value,
        level: $("level").value,
        language: $("language").value,
        esl: $("esl").checked,
        qatar: $("qatar").checked,
        sdg: $("sdg").checked,
        exam: $("exam").checked,
        answers: $("answers").checked,
        type: document.querySelector('input[name="rtype"]:checked')?.value || "video"
      };
    }

    function buildPrompt(options) {
      const base = `Curriculum: ${options.curriculum}
Class: ${options.grade}
Subject: ${options.subject}
Topic: ${options.topic}
Duration: ${options.duration} minutes
Learner level: ${options.level}
Output language: ${options.language}
Follow the scope and sequence of the ${options.curriculum} syllabus for this class and subject. If the topic is not in that syllabus, say so and suggest the closest syllabus topic.
Use clear headings, numbered sections, and ready-to-use teacher-friendly formatting.`;

      let extras = "";
      if (options.esl) extras += `\nESL support: add simple sentence frames, key vocabulary with pronunciation, and a glossary. Focus where suitable on: ${ESL_FOCUS.join(", ")}.`;
      if (options.qatar) extras += "\nInclude Qatar National Values with a concrete classroom example.";
      if (options.sdg) extras += "\nLink the lesson to relevant UN Sustainable Development Goals and name each goal number.";
      if (options.exam) extras += "\nUse exam-style questions with mark allocations matching the curriculum assessment format.";
      if (options.answers) extras += "\nInclude a complete answer key at the end.";

      const templates = {
        video: `Create a complete educational video lesson script.\n${base}\nInclude: 1. Video title 2. Learning objectives 3. Scene-by-scene script with timings 4. Teacher narration 5. On-screen text 6. Subtitles 7. Visual suggestions 8. Recap 9. ${options.count} practice questions 10. Teacher notes.${extras}`,
        lessonplan: `Create a detailed lesson plan.\n${base}\nInclude: learning objectives, success criteria, prior knowledge, warm-up, main activities with timings, differentiation, resources, assessment, homework, and teacher reflection prompts.${extras}`,
        dlp: `Create a Daily Lesson Plan (DLP).\n${base}\nInclude: learning objectives, learning outcomes, previous knowledge, teaching-learning strategies, teacher activities, student activities, cross-curricular integration, assessment, differentiation, and reflection. Present the plan in a teacher-friendly table format.${extras}`,
        notes: `Create student-friendly notes.\n${base}\nInclude: key definitions, detailed explanation, worked examples, diagram descriptions, ${options.count} short-answer questions, long-answer questions, MCQs, fill-in-the-blanks, and a revision summary.${extras}`,
        worksheet: `Create a printable student worksheet.\n${base}\nInclude ${options.count} varied questions (MCQ, fill-in-the-blank, short answer, matching), clear instructions for each section, and space markers for answers.${extras}`,
        qpaper: `Create a question paper.\n${base}\nInclude a header (class, subject, time, maximum marks), sections A/B/C with ${options.count} questions in total, marks for each question, a mark distribution table, and a marking scheme.${extras}`,
        flashcards: `Create ${options.count} flashcards.\n${base}\nFormat each card as: Card number | Front (term or question) | Back (definition or answer) | Example. Keep language suitable for the class level.${extras}`,
        rubric: `Create an assessment rubric.\n${base}\nInclude 4 to 5 criteria, performance levels (Excellent, Good, Developing, Beginning), descriptors for each, the marks for each level, and total marks.${extras}`,
        quiz: `Create a quiz with ${options.count} questions.\n${base}\nMix MCQs and true/false. Give 4 options for each MCQ, mark the correct answer, and provide a one-line explanation for each answer.${extras}`,
        slides: `Create a slide-by-slide outline.\n${base}\nFor each slide, give slide number, title, 3 to 5 bullet points, speaker notes (2 to 3 sentences), and a suggested visual. Aim for about ${Math.max(5, Math.round(options.duration / 4))} slides.${extras}`
      };
      return templates[options.type] || templates.video;
    }

    async function callAI(prompt) {
      const res = await fetch(CONFIG.endpoint, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.text) {
        throw new Error(data.error || `Server returned ${res.status}`);
      }
      return data.text;
    }

    function getProjects() {
      try {
        return JSON.parse(localStorage.getItem("richardAIProjects") || "[]");
      } catch {
        return [];
      }
    }

    function saveProjects(projects) {
      localStorage.setItem("richardAIProjects", JSON.stringify(projects));
      renderProjects();
    }

    function renderProjects() {
      const list = $("projectList");
      list.innerHTML = "";
      const projects = getProjects();
      $("statProjects").textContent = String(projects.length || 0);

      if (!projects.length) {
        list.innerHTML = '<div class="project-item"><div class="project-meta"><span class="title">No saved projects yet</span><span class="date">Generate your first lesson set</span></div></div>';
        return;
      }

      projects.forEach((project, index) => {
        const row = document.createElement("div");
        row.className = "project-item";
        row.innerHTML = `
          <div class="project-meta">
            <span class="title">${project.title}</span>
            <span class="date">${project.date || "Recent"}</span>
          </div>
          <div class="project-actions">
            <button class="mini-btn" data-open="${index}">Open</button>
            <button class="mini-btn" data-delete="${index}">Delete</button>
          </div>
        `;

        row.querySelector("[data-open]").addEventListener("click", () => {
          lastResult = project;
          output.textContent = project.text;
          setStatus("Loaded from library.", "success");
          setActionState(true);
        });

        row.querySelector("[data-delete]").addEventListener("click", () => {
          const updated = getProjects().filter((_, i) => i !== index);
          saveProjects(updated);
        });

        list.appendChild(row);
      });
    }

    function setActionState(enabled) {
      ["copyBtn", "saveToLibraryBtn", "docxBtn", "pdfBtn"].forEach(id => {
        $(id).disabled = !enabled;
      });
    }

    function saveCurrentProject() {
      if (!lastResult) {
        setStatus("Generate content before saving it.", "error");
        return;
      }

      const projects = getProjects();
      projects.unshift(lastResult);
      saveProjects(projects.slice(0, 100));
      setStatus("Saved to your library.", "success");
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[c]));
    }

    function exportDocx() {
      if (!lastResult) return;
      const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8" /></head><body><pre style="font-family:Calibri,Arial;white-space:pre-wrap;">${escapeHtml(lastResult.text)}</pre></body></html>`;
      const blob = new Blob([html], { type: "application/msword" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `${lastResult.title.replace(/[^\w\- ]+/g, "").slice(0, 80)}.doc`;
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus("Word file prepared.", "success");
    }

    function printPdf() {
      if (!lastResult) return;
      const printWindow = window.open("", "_blank");
      if (!printWindow) {
        setStatus("Allow pop-ups to print or save as PDF.", "error");
        return;
      }

      printWindow.document.write(`
        <html>
          <head>
            <title>${escapeHtml(lastResult.title)}</title>
            <style>body{font-family:Arial;padding:24px;line-height:1.5;} pre{white-space:pre-wrap;}</style>
          </head>
          <body>
            <h2>${escapeHtml(lastResult.title)}</h2>
            <pre>${escapeHtml(lastResult.text)}</pre>
          </body>
        </html>
      `);
      printWindow.document.close();
      printWindow.focus();
      printWindow.print();
      setStatus("Print dialog opened.", "success");
    }

    function toggleAuthModal(show) {
      authModal.classList.toggle("open", show);
      authModal.setAttribute("aria-hidden", String(!show));
    }

    function saveCurrentUser(name, email) {
      localStorage.setItem("richardAIUser", JSON.stringify({ name, email }));
      $("userTag").textContent = name || "Guest";
      $("loginBtn").textContent = "Profile";
      $("signupBtn").textContent = "New project";
    }

    function getCurrentUser() {
      try {
        return JSON.parse(localStorage.getItem("richardAIUser") || "null");
      } catch {
        return null;
      }
    }

    function initAuthUI() {
      const user = getCurrentUser();
      if (user) {
        $("userTag").textContent = user.name || "Teacher";
        $("loginBtn").textContent = "Profile";
        $("signupBtn").textContent = "New project";
      }
    }

    function handleAuthSubmit() {
      const name = $("authName").value.trim();
      const email = $("authEmail").value.trim();
      const password = $("authPassword").value.trim();

      if (!email || !password) {
        setStatus("Please enter an email and password.", "error");
        return;
      }

      saveCurrentUser(name || email.split("@")[0], email);
      toggleAuthModal(false);
      setStatus(`Welcome, ${name || email}. Ready to generate resources.`, "success");
    }

    function bindEvents() {
      $("curriculum").addEventListener("change", refreshSubjects);
      $("generateBtn").addEventListener("click", async () => {
        const options = getCurrentOptions();
        if (!options.topic) {
          setStatus("Please enter a topic or chapter name.", "error");
          return;
        }

        setStatus("Generating content... this can take 20–60 seconds.", "");
        output.textContent = "";

        try {
          const prompt = buildPrompt(options);
          const text = await callAI(prompt);
          const title = `${RESOURCES.find(r => r.id === options.type)?.label || "Resource"} - ${options.subject} ${options.grade} - ${options.topic}`;
          lastResult = {
            title,
            text,
            date: new Date().toLocaleString(),
            type: options.type
          };
          output.textContent = text;
          setActionState(true);
          setStatus("Done. Copy, save, or export your content.", "success");
        } catch (error) {
          console.error(error);
          setStatus(`Could not generate: ${error.message}`, "error");
        }
      });

      $("saveProjectBtn").addEventListener("click", saveCurrentProject);
      $("saveToLibraryBtn").addEventListener("click", saveCurrentProject);
      $("copyBtn").addEventListener("click", async () => {
        if (!lastResult) return;
        await navigator.clipboard.writeText(lastResult.text);
        setStatus("Copied to clipboard.", "success");
      });
      $("docxBtn").addEventListener("click", exportDocx);
      $("pdfBtn").addEventListener("click", printPdf);

      $("loginBtn").addEventListener("click", () => {
        isLoginMode = true;
        authTitle.textContent = "Welcome back";
        toggleAuthModal(true);
      });

      $("signupBtn").addEventListener("click", () => {
        isLoginMode = false;
        authTitle.textContent = "Create your account";
        toggleAuthModal(true);
      });

      $("closeAuthBtn").addEventListener("click", () => toggleAuthModal(false));
      $("authSubmitBtn").addEventListener("click", handleAuthSubmit);
      $("toggleAuthModeBtn").addEventListener("click", () => {
        isLoginMode = !isLoginMode;
        authTitle.textContent = isLoginMode ? "Welcome back" : "Create your account";
        $("toggleAuthModeBtn").textContent = isLoginMode ? "Create account" : "Login";
      });

      $("authModal").addEventListener("click", e => {
        if (e.target === authModal) toggleAuthModal(false);
      });
    }

    renderCurriculumOptions();
    renderResourceTypes();
    renderProjects();
    setActionState(false);
    initAuthUI();
    bindEvents();
  </script>
</body>
</html>
