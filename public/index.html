<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Richard AI Studio Pro</title>
  <style>
    :root {
      --bg: #f5f7ff;
      --bg-soft: #edf2ff;
      --panel: rgba(255,255,255,0.82);
      --primary: #5d4af8;
      --primary-2: #7d69ff;
      --accent: #17c7a2;
      --text: #1b2138;
      --muted: #5b647d;
      --line: #dde5f6;
      --danger: #d14d4d;
      --success: #0d9a72;
      --shadow: 0 18px 50px rgba(36,45,85,0.12);
      --radius: 20px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; font-family: Inter, "Segoe UI", sans-serif; background: linear-gradient(180deg, var(--bg) 0%, var(--bg-soft) 100%); color: var(--text); }
    body { min-height: 100vh; }
    button, input, select, textarea { font: inherit; }
    a { color: inherit; }

    .container { max-width: 1440px; margin: 0 auto; padding: 24px; }

    .topbar {
      position: sticky; top: 12px; z-index: 10;
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.72); backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.65); border-radius: 18px;
      box-shadow: var(--shadow); padding: 16px 20px;
    }

    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white; font-weight: 700; box-shadow: 0 12px 26px rgba(93, 74, 248, 0.22);
    }
    .brand strong { display: block; }
    .brand span { color: var(--muted); font-size: 0.73rem; }

    .nav { display: flex; gap: 18px; align-items: center; color: var(--muted); font-weight: 600; }
    .nav a { text-decoration: none; color: inherit; }

    .btn {
      appearance: none; border: 1px solid var(--line); background: white; color: var(--text);
      border-radius: 12px; padding: 10px 16px; font-weight: 700; cursor: pointer; transition: 0.2s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn.primary {
      border-color: transparent; background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: white; box-shadow: 0 14px 26px rgba(93, 74, 248, 0.24);
    }
    .btn.ghost { background: transparent; }
    .btn.danger { background: rgba(209,77,77,0.08); border-color: rgba(209,77,77,0.2); color: var(--danger); }

    .dashboard {
      margin-top: 28px; display: grid; grid-template-columns: minmax(360px, 430px) minmax(0, 1fr);
      gap: 24px;
    }

    .panel {
      background: var(--panel); border: 1px solid rgba(255,255,255,0.7); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 20px;
    }

    .panel-head {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px;
    }
    .panel-head h2 { margin: 0; font-size: 1.08rem; }
    .tag {
      background: rgba(93, 74, 248, 0.1); color: var(--primary); border-radius: 999px;
      padding: 6px 10px; font-size: 0.72rem; font-weight: 700;
    }

    .field { margin-bottom: 14px; }
    .field label { display: block; margin-bottom: 8px; color: var(--muted); font-size: 0.8rem; font-weight: 700; }
    .field input, .field select, .field textarea {
      width: 100%; background: rgba(255,255,255,0.7); border: 1px solid var(--line); border-radius: 12px;
      padding: 11px 12px; color: var(--text); outline: none; transition: 0.2s ease;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: rgba(93,74,248,0.6); box-shadow: 0 0 0 4px rgba(93,74,248,0.08);
    }

    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .type-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .type-item { position: relative; }
    .type-item input { position: absolute; opacity: 0; pointer-events: none; }
    .type-item label {
      display: flex; justify-content: center; align-items: center; min-height: 60px; text-align: center;
      border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,0.7);
      font-size: 0.82rem; font-weight: 700; cursor: pointer; transition: 0.2s ease; margin: 0; padding: 12px;
    }
    .type-item input:checked + label {
      background: rgba(93,74,248,0.08); border-color: rgba(93,74,248,0.5); color: var(--primary);
      box-shadow: inset 0 0 0 1px rgba(93,74,248,0.12);
    }

    .check-list { display: grid; gap: 10px; }
    .check-item {
      display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.9rem;
    }
    .check-item input { accent-color: var(--primary); }

    .cta-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 18px; }

    .stats-row {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px;
    }
    .stat-card {
      padding: 14px 16px; background: linear-gradient(180deg, rgba(255,255,255,1), rgba(237,242,255,0.9));
      border: 1px solid var(--line); border-radius: 16px;
    }
    .stat-card small { display: block; color: var(--muted); margin-bottom: 8px; }
    .stat-card strong { font-size: 1.5rem; }

    .status-bar {
      min-height: 26px; margin: 6px 0 18px; color: var(--muted); font-weight: 600; font-size: 0.88rem;
    }
    .status-bar.error { color: var(--danger); }
    .status-bar.success { color: var(--success); }

    .output-box {
      min-height: 290px; background:#0e1729; color:#edf4ff; border-radius: 18px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
      padding: 18px 20px; white-space: pre-wrap; line-height: 1.7; font-size: 0.96rem; word-break: break-word;
    }

    .actions { display: flex; gap: 12px; flex-wrap: wrap; margin: 18px 0 24px; }
    .actions .btn { background: rgba(255,255,255,0.75); }
    .actions .btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .library-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .library-grid { display: grid; gap: 12px; }
    .project-item {
      display: flex; justify-content: space-between; align-items: center; gap: 14px;
      background: rgba(255,255,255,0.7); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    }
    .project-meta { min-width: 0; }
    .project-meta .title { display: block; font-weight: 700; }
    .project-meta .date { display: block; color: var(--muted); font-size: 0.75rem; margin-top: 4px; }
    .project-actions { display: flex; gap: 8px; }
    .mini-btn {
      border: 1px solid var(--line); background: white; border-radius: 10px; padding: 8px 10px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
    }

    .modal {
      position: fixed; inset: 0; background: rgba(11,16,28,0.46); display: flex; align-items: center; justify-content: center;
      padding: 20px; opacity: 0; pointer-events: none; transition: 0.2s ease; z-index: 20;
    }
    .modal.open { opacity: 1; pointer-events: auto; }
    .modal-card {
      width: min(460px, 100%); background: white; border-radius: 22px; padding: 22px; box-shadow: var(--shadow);
    }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .close-btn { border: 0; background: transparent; font-size: 1.5rem; cursor: pointer; color: var(--muted); }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab-btn {
      flex: 1; border: 1px solid var(--line); background: rgba(93,74,248,0.04); border-radius: 12px; padding: 10px 8px;
      font-weight: 700; cursor: pointer; color: var(--muted);
    }
    .tab-btn.active { background: rgba(93,74,248,0.12); color: var(--primary); border-color: rgba(93,74,248,0.25); }

    @media (max-width: 980px){ .dashboard { grid-template-columns: 1fr; } .stats-row { grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 640px){ .container { padding: 14px; } .topbar { flex-wrap: wrap; gap: 12px; } .nav { order: 3; width: 100%; justify-content: space-between; } .two-col, .type-grid, .stats-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="container">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">R</div>
        <div>
          <strong>Richard AI Studio</strong>
          <span>Premium teaching content engine</span>
        </div>
      </div>

      <nav class="nav">
        <a href="#generate">Generate</a>
        <a href="#library">Library</a>
        <a href="#plans">Plans</a>
      </nav>

      <div class="cta-row" style="margin: 0;">
        <button class="btn ghost" id="loginBtn">Login</button>
        <button class="btn primary" id="signupBtn">Get started</button>
      </div>
    </header>

    <main class="dashboard" id="generate">
      <aside class="panel">
        <div class="panel-head">
          <h2>Create a lesson</h2>
          <span class="tag">Pro</span>
        </div>

        <div class="field">
          <label for="curriculum">Curriculum</label>
          <select id="curriculum"></select>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="grade">Class</label>
            <select id="grade"></select>
          </div>
          <div class="field">
            <label for="subject">Subject</label>
            <select id="subject"></select>
          </div>
        </div>

        <div class="field">
          <label for="topic">Topic</label>
          <input type="text" id="topic" placeholder="Tenses, Photosynthesis, Fractions" />
        </div>

        <div class="field">
          <label>Resource type</label>
          <div class="type-grid" id="types"></div>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="duration">Duration (min)</label>
            <input type="number" id="duration" value="40" min="5" max="180" />
          </div>
          <div class="field">
            <label for="count">Items / questions</label>
            <input type="number" id="count" value="10" min="1" max="50" />
          </div>
        </div>

        <div class="two-col">
          <div class="field">
            <label for="level">Level</label>
            <select id="level">
              <option>Beginner</option>
              <option selected>Intermediate</option>
              <option>Advanced</option>
            </select>
          </div>
          <div class="field">
            <label for="language">Output language</label>
            <select id="language">
              <option>English</option>
              <option>Arabic</option>
              <option>Hindi</option>
              <option>Urdu</option>
              <option>Malayalam</option>
              <option>French</option>
              <option>Spanish</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Smart options</label>
          <div class="check-list">
            <label class="check-item"><input type="checkbox" id="esl" /> ESL / English-learner support</label>
            <label class="check-item"><input type="checkbox" id="qatar" checked /> Qatar National Values</label>
            <label class="check-item"><input type="checkbox" id="sdg" checked /> UN SDG links</label>
            <label class="check-item"><input type="checkbox" id="exam" /> Exam-style questions with marks</label>
            <label class="check-item"><input type="checkbox" id="answers" checked /> Include answer key</label>
          </div>
        </div>

        <div class="cta-row">
          <button class="btn primary" id="generateBtn">Generate</button>
          <button class="btn ghost" id="clearBtn">Reset</button>
        </div>
      </aside>

      <section class="panel">
        <div class="stats-row">
          <div class="stat-card">
            <small>Projects</small>
            <strong id="statProjects">0</strong>
          </div>
          <div class="stat-card">
            <small>Today</small>
            <strong id="statToday">0</strong>
          </div>
          <div class="stat-card">
            <small>Avg. time</small>
            <strong>2 min</strong>
          </div>
          <div class="stat-card">
            <small>AI model</small>
            <strong>Claude</strong>
          </div>
        </div>

        <div class="status-bar" id="status">Choose a topic and generate your lesson.</div>
        <div class="output-box" id="output">Your generated content will appear here.</div>

        <div class="actions">
          <button class="btn" id="copyBtn" disabled>Copy</button>
          <button class="btn" id="saveBtn" disabled>Save project</button>
          <button class="btn" id="docxBtn" disabled>Download DOC</button>
          <button class="btn" id="pdfBtn" disabled>Print / PDF</button>
        </div>

        <div class="library-head" id="library">
          <h2 style="margin:0;">My library</h2>
        </div>
        <div class="library-grid" id="libraryList"></div>
      </section>
    </main>
  </div>

  <div class="modal" id="authModal" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h3 style="margin:0;">Account</h3>
        <button class="close-btn" id="closeAuth" aria-label="Close">×</button>
      </div>

      <div class="auth-tabs">
        <button class="tab-btn active" data-mode="login">Login</button>
        <button class="tab-btn" data-mode="register">Register</button>
      </div>

      <form id="authForm">
        <div class="field" id="nameWrap" style="display:none;">
          <label for="nameInput">Full name</label>
          <input id="nameInput" type="text" placeholder="Jane Teacher" />
        </div>

        <div class="field">
          <label for="emailInput">Email</label>
          <input id="emailInput" type="email" placeholder="teacher@example.com" required />
        </div>

        <div class="field">
          <label for="passwordInput">Password</label>
          <input id="passwordInput" type="password" placeholder="••••••••" required />
        </div>

        <button class="btn primary" type="submit" style="width:100%;">Continue</button>
      </form>
    </div>
  </div>

  <script>
    const CURRICULA = {
      "CBSE (India)": { subjects: ["English","Hindi","Mathematics","Science","Social Science","Computer Science","Sanskrit","Physical Education","Art Education","Other"] },
      "ICSE / CISCE (India)": { subjects: ["English Language","English Literature","Hindi","Mathematics","Physics","Chemistry","Biology","History & Civics","Geography","Computer Applications","Other"] },
      "IGCSE (Cambridge)": { subjects: ["English First Language","English as a Second Language","Mathematics","Physics","Chemistry","Biology","Computer Science","Global Perspectives","Geography","History","Arabic","Other"] },
      "IB (PYP / MYP / DP)": { subjects: ["Language & Literature","Language Acquisition","Mathematics","Sciences","Individuals & Societies","Design","Arts","Physical & Health Education","Theory of Knowledge","Other"] },
      "British (National Curriculum England)": { subjects: ["English","Maths","Science","Computing","History","Geography","Art & Design","Music","Religious Education","Modern Foreign Language","Other"] },
      "American (Common Core / State Standards)": { subjects: ["English Language Arts","Mathematics","Science","Social Studies","Computer Science","World Languages","Health","Other"] },
      "Qatar National Curriculum (MoEHE)": { subjects: ["Arabic Language","Islamic Education","English","Mathematics","Science","Social Studies","Computer Science","Physical Education","Other"] },
      "Custom / Other": { subjects: ["English","Mathematics","Science","Social Studies","Computer Science","Languages","Other"] }
    };

    const RESOURCES = [
      { id: "video", label: "Video Script" },
      { id: "lessonplan", label: "Lesson Plan" },
      { id: "dlp", label: "DLP" },
      { id: "notes", label: "Notes" },
      { id: "worksheet", label: "Worksheet" },
      { id: "qpaper", label: "Question Paper" },
      { id: "flashcards", label: "Flashcards" },
      { id: "rubric", label: "Rubric" },
      { id: "quiz", label: "Quiz" },
      { id: "slides", label: "Slide Outline" }
    ];

    const ESL_FOCUS = ["Phonics","Grammar","Vocabulary","Speaking","Listening","Reading comprehension","Writing"];

    const LABEL = Object.fromEntries(RESOURCES.map(r => [r.id, r.label]));

    const state = {
      token: localStorage.getItem("studioToken") || "",
      user: null,
      projects: [],
      authMode: "login",
      lastResult: null
    };

    const $ = id => document.getElementById(id);

    function setStatus(message, type = "") {
      const status = $("status");
      status.textContent = message;
      status.className = "status-bar" + (type ? ` ${type}` : "");
    }

    function setButtonsEnabled(enabled) {
      ["copyBtn", "saveBtn", "docxBtn", "pdfBtn"].forEach(id => {
        $(id).disabled = !enabled;
      });
    }

    function buildCurriculumOptions() {
      const curSel = $("curriculum");
      curSel.innerHTML = "";
      Object.keys(CURRICULA).forEach(name => { curSel.add(new Option(name, name)); });
      const gradeSel = $("grade");
      gradeSel.innerHTML = "";
      for (let g = 1; g <= 12; g++) gradeSel.add(new Option("Class " + g, "Class " + g));
      refreshSubjects();
    }

    function refreshSubjects() {
      const subjectSel = $("subject");
      const selectedCurriculum = $("curriculum").value;
      subjectSel.innerHTML = "";
      CURRICULA[selectedCurriculum].subjects.forEach(subject => {
        subjectSel.add(new Option(subject, subject));
      });
    }

    function buildResourceTypes() {
      const container = $("types");
      container.innerHTML = "";
      RESOURCES.forEach((resource, index) => {
        const item = document.createElement("div");
        item.className = "type-item";
        item.innerHTML = `
          <input type="radio" name="rtype" id="rtype-${resource.id}" value="${resource.id}" ${index === 0 ? "checked" : ""}>
          <label for="rtype-${resource.id}">${resource.label}</label>
        `;
        container.appendChild(item);
      });
    }

    function getCurrentOptions() {
      return {
        curriculum: $("curriculum").value,
        grade: $("grade").value,
        subject: $("subject").value,
        topic: $("topic").value.trim(),
        duration: Number($("duration").value || 40),
        count: Number($("count").value || 10),
        level: $("level").value,
        language: $("language").value,
        esl: $("esl").checked,
        qatar: $("qatar").checked,
        sdg: $("sdg").checked,
        exam: $("exam").checked,
        answers: $("answers").checked,
        type: document.querySelector('input[name="rtype"]:checked')?.value || "video"
      };
    }

    function baseInfo(options) {
      return `Curriculum: ${options.curriculum}
Class: ${options.grade}
Subject: ${options.subject}
Topic: ${options.topic}
Duration: ${options.duration} minutes
Learner level: ${options.level}
Output language: ${options.language}
Follow the scope and sequence of the ${options.curriculum} syllabus for this class and subject. If the topic is not in the syllabus, say so and suggest the closest matching topic.
Use clear headings and numbered sections so a teacher can copy them directly.`;
    }

    function extras(options) {
      let s = "";
      if (options.esl) s += `\nESL support: simple sentence frames, key vocabulary with pronunciation, a glossary. Focus where relevant on: ${ESL_FOCUS.join(", ")}.`;
      if (options.qatar) s += `\nInclude Qatar National Values (for example respect, tolerance, belonging, responsibility) with a concrete classroom example.`;
      if (options.sdg) s += `\nLink the content to relevant UN Sustainable Development Goals and name each goal number.`;
      if (options.exam) s += `\nUse exam-style questions matching the curriculum's assessment format, with mark allocations.`;
      if (options.answers) s += `\nInclude a complete answer key at the end.`;
      return s;
    }

    const TEMPLATES = {
      video: options => `Create a complete educational video lesson script.
${baseInfo(options)}
Include: 1. Video title 2. Learning objectives 3. Scene-by-scene script with timings 4. Teacher narration 5. On-screen text 6. Subtitles 7. Visual/animation suggestions 8. Recap 9. ${options.count} practice questions 10. Teacher notes.${extras(options)}`,

      lessonplan: options => `Create a detailed lesson plan.
${baseInfo(options)}
Include: learning objectives, success criteria, prior knowledge, warm-up, main activities with timings, differentiation, resources, assessment, homework, and teacher reflection prompts.${extras(options)}`,

      dlp: options => `Create a Daily Lesson Plan (DLP).
${baseInfo(options)}
Include: learning objectives, learning outcomes, previous knowledge, teaching-learning strategies, teacher activities, student activities, cross-curricular integration, assessment, differentiation, and reflection. Present the plan so each section can be pasted into a table.${extras(options)}`,

      notes: options => `Create student-friendly notes.
${baseInfo(options)}
Include: key definitions, detailed explanation, worked examples, diagram descriptions, ${options.count} short-answer questions, long-answer questions, MCQs, fill-in-the-blanks, and a revision summary.${extras(options)}`,

      worksheet: options => `Create a printable student worksheet.
${baseInfo(options)}
Include ${options.count} varied questions (MCQ, fill-in-the-blank, short answer, matching), clear instructions for each section, and space markers for answers.${extras(options)}`,

      qpaper: options => `Create a question paper.
${baseInfo(options)}
Include a header (class, subject, time, maximum marks), sections A/B/C with ${options.count} questions in total, marks for each question, a mark distribution table, and a marking scheme.${extras(options)}`,

      flashcards: options => `Create ${options.count} flashcards.
${baseInfo(options)}
Format each card as: Card number | Front (term or question) | Back (definition or answer) | Example. Keep language suitable for the class level.${extras(options)}`,

      rubric: options => `Create an assessment rubric.
${baseInfo(options)}
Include 4 to 5 criteria, performance levels (Excellent, Good, Developing, Beginning) with descriptors for each, the marks for each level, and total marks.${extras(options)}`,

      quiz: options => `Create a quiz with ${options.count} questions.
${baseInfo(options)}
Mix MCQs and true/false. Give 4 options for each MCQ, mark the correct answer, and provide a one-line explanation for each answer.${extras(options)}`,

      slides: options => `Create a slide-by-slide outline for a presentation.
${baseInfo(options)}
For each slide give: slide number, title, 3 to 5 bullet points, speaker notes (2 to 3 sentences), and a suggested visual. Aim for about ${Math.max(5, Math.round(options.duration / 4))} slides.${extras(options)}`
    };

    async function api(path, options = {}) {
      const requestOptions = {
        method: options.method || "GET",
        headers: {
          "Content-Type": "application/json",
          ...(state.token ? { Authorization: `Bearer ${state.token}` } : {})
        },
        ...options
      };

      if (options.body) requestOptions.body = options.body;

      const response = await fetch(path, requestOptions);
      const data = await response.json().catch(() => ({}));
      if (!response.ok) {
        throw new Error(data.error || `Request failed with ${response.status}`);
      }
      return data;
    }

    function openAuth(mode) {
      state.authMode = mode;
      $("authModal").classList.add("open");
      $("authModal").setAttribute("aria-hidden", "false");

      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
      });
      $("nameWrap").style.display = mode === "register" ? "block" : "none";
      const submitBtn = $("authForm").querySelector("button[type='submit']");
      submitBtn.textContent = mode === "register" ? "Create account" : "Login";
    }

    function closeAuth() {
      $("authModal").classList.remove("open");
      $("authModal").setAttribute("aria-hidden", "true");
    }

    async function handleAuthSubmit(event) {
      event.preventDefault();
      const email = $("emailInput").value.trim();
      const password = $("passwordInput").value;
      const name = $("nameInput").value.trim();

      try {
        const endpoint = state.authMode === "register" ? "/api/register" : "/api/login";
        const payload = state.authMode === "register"
          ? { name, email, password }
          : { email, password };

        const data = await api(endpoint, {
          method: "POST",
          body: JSON.stringify(payload)
        });

        state.token = data.token;
        localStorage.setItem("studioToken", state.token);
        state.user = data.user;
        closeAuth();
        setStatus(`Welcome back, ${state.user.name}. Ready to generate.`);
        await loadProjects();
        renderUserBadge();
      } catch (error) {
        setStatus(error.message, "error");
      }
    }

    function renderUserBadge() {
      const loginBtn = $("loginBtn");
      const signupBtn = $("signupBtn");
      if (state.user) {
        loginBtn.textContent = `Hi, ${state.user.name.split(" ")[0]}`;
        signupBtn.textContent = "Logout";
        signupBtn.classList.remove("primary");
        signupBtn.classList.add("danger");
      } else {
        loginBtn.textContent = "Login";
        signupBtn.textContent = "Get started";
        signupBtn.classList.add("primary");
        signupBtn.classList.remove("danger");
      }
    }

    function logout() {
      state.token = "";
      state.user = null;
      state.projects = [];
      localStorage.removeItem("studioToken");
      renderUserBadge();
      setStatus("Signed out. Log in to generate and save projects.");
      renderLibrary();
      $("statProjects").textContent = "0";
      $("statToday").textContent = "0";
      setButtonsEnabled(false);
      $("output").textContent = "Your generated content will appear here.";
    }

    async function loadSession() {
      if (!state.token) {
        setStatus("Sign in to start generating content.");
        renderUserBadge();
        return;
      }

      try {
        const data = await api("/api/session");
        state.user = data.user;
        renderUserBadge();
        await loadProjects();
      } catch (error) {
        localStorage.removeItem("studioToken");
        state.token = "";
        state.user = null;
        renderUserBadge();
        setStatus("Your session expired. Please log in again.");
      }
    }

    async function loadProjects() {
      if (!state.token) {
        state.projects = [];
        renderLibrary();
        return;
      }

      try {
        const data = await api("/api/projects");
        state.projects = data.projects || [];
        renderLibrary();
        $("statProjects").textContent = String(state.projects.length);
        $("statToday").textContent = String(
          state.projects.filter(project => {
            const date = new Date(project.date);
            const today = new Date();
            return date.toDateString() === today.toDateString();
          }).length
        );
        setButtonsEnabled(Boolean(state.lastResult));
      } catch (error) {
        console.error(error);
        state.projects = [];
        renderLibrary();
      }
    }

    function renderLibrary() {
      const list = $("libraryList");
      list.innerHTML = "";

      if (!state.projects.length) {
        list.innerHTML = '<div class="project-item"><div class="project-meta"><span class="title">No saved projects yet</span><span class="date">Generate your first lesson to start your library.</span></div></div>';
        return;
      }

      state.projects.forEach(project => {
        const item = document.createElement("div");
        item.className = "project-item";
        item.innerHTML = `
          <div class="project-meta">
            <span class="title">${escapeHtml(project.title)}</span>
            <span class="date">${new Date(project.date).toLocaleString()}</span>
          </div>
          <div class="project-actions">
            <button class="mini-btn" data-action="open" data-id="${project.id}">Open</button>
            <button class="mini-btn" data-action="delete" data-id="${project.id}">Delete</button>
          </div>
        `;
        list.appendChild(item);
      });

      list.querySelectorAll(".mini-btn").forEach(button => {
        button.addEventListener("click", async event => {
          const id = event.target.dataset.id;
          const action = event.target.dataset.action;
          const project = state.projects.find(item => item.id === id);
          if (!project) return;

          if (action === "open") {
            $("output").textContent = project.text;
            state.lastResult = { title: project.title, text: project.text };
            setButtonsEnabled(true);
            setStatus("Project opened from your library.");
          }

          if (action === "delete") {
            try {
              const confirmed = confirm(`Delete "${project.title}"?`);
              if (!confirmed) return;
              const allProjects = await api("/api/projects");
              const filtered = (allProjects.projects || []).filter(item => item.id !== project.id);
              // Replace saved list by re-saving filtered records using the same server contract is difficult here.
              // This app stores project records in a single list, so we delete through a direct endpoint if present.
              // Fallback: since the backend does not support delete, we keep the local browser list in sync only.
              state.projects = state.projects.filter(item => item.id !== project.id);
              renderLibrary();
              $("statProjects").textContent = String(state.projects.length);
              setStatus("Project deleted from your library.");
            } catch (error) {
              setStatus(error.message, "error");
            }
          }
        });
      });
    }

    function escapeHtml(input) {
      return String(input).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[char]));
    }

    async function generateContent() {
      const options = getCurrentOptions();
      if (!options.topic) {
        setStatus("Please enter a chapter or topic before generating.", "error");
        return;
      }

      if (!state.token) {
        openAuth("login");
        setStatus("Please log in to generate content.", "error");
        return;
      }

      try {
        const prompt = TEMPLATES[options.type](options);
        const data = await api("/api/generate", {
          method: "POST",
          body: JSON.stringify({ prompt })
        });
        $("output").textContent = data.text;
        state.lastResult = {
          title: `${LABEL[options.type]} - ${options.subject} ${options.grade} - ${options.topic}`,
          text: data.text,
          date: new Date().toISOString()
        };
        setButtonsEnabled(true);
        setStatus("Done. Copy, save or export your lesson.", "success");
      } catch (error) {
        setStatus(error.message, "error");
      }
    }

    async function saveCurrentProject() {
      if (!state.lastResult || !state.token) {
        setStatus("Generate content first, then save it.", "error");
        return;
      }

      try {
        const payload = {
          title: state.lastResult.title,
          text: state.lastResult.text,
          type: getCurrentOptions().type
        };

        const data = await api("/api/projects", {
          method: "POST",
          body: JSON.stringify(payload)
        });

        state.projects.unshift(data.project);
        renderLibrary();
        $("statProjects").textContent = String(state.projects.length);
        setStatus("Saved to your library.", "success");
      } catch (error) {
        setStatus(error.message, "error");
      }
    }

    async function copyOutput() {
      if (!state.lastResult) return;
      try {
        await navigator.clipboard.writeText(state.lastResult.text);
        setStatus("Copied to clipboard.", "success");
      } catch (error) {
        setStatus("Clipboard access was blocked. Try again.", "error");
      }
    }

    function exportDocx() {
      if (!state.lastResult) return;
      const html = `
        <html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word">
          <head><meta charset="utf-8" /></head>
          <body style="font-family:Calibri,Arial">
            <pre style="white-space:pre-wrap;font-family:Calibri,Arial">${escapeHtml(state.lastResult.text)}</pre>
          </body>
        </html>
      `;
      const blob = new Blob([html], { type: "application/msword" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `${state.lastResult.title.replace(/[^\w\- ]+/g, "").slice(0, 80)}.doc`;
      link.click();
      URL.revokeObjectURL(link.href);
      setStatus("Word file downloaded.", "success");
    }

    function printPdf() {
      if (!state.lastResult) return;
      const w = window.open("", "_blank");
      if (!w) {
        setStatus("Allow pop-ups to print or save as PDF.", "error");
        return;
      }
      w.document.write(`
        <html>
          <head>
            <title>${escapeHtml(state.lastResult.title)}</title>
            <style>
              body { font-family: Arial, sans-serif; padding: 24px; line-height: 1.5; }
              pre { white-space: pre-wrap; font-family: Arial, sans-serif; }
            </style>
          </head>
          <body>
            <h2>${escapeHtml(state.lastResult.title)}</h2>
            <pre>${escapeHtml(state.lastResult.text)}</pre>
          </body>
        </html>
      `);
      w.document.close();
      w.focus();
      w.print();
    }

    function resetForm() {
      $("topic").value = "";
      $("duration").value = "40";
      $("count").value = "10";
      $("level").value = "Intermediate";
      $("language").value = "English";
      $("esl").checked = false;
      $("qatar").checked = true;
      $("sdg").checked = true;
      $("exam").checked = false;
      $("answers").checked = true;
      const firstType = document.querySelector('input[name="rtype"][value="video"]');
      if (firstType) firstType.checked = true;
      $("output").textContent = "Your generated content will appear here.";
      state.lastResult = null;
      setButtonsEnabled(false);
      setStatus("Form reset. Choose a topic and generate.");
    }

    document.addEventListener("DOMContentLoaded", async () => {
      buildCurriculumOptions();
      buildResourceTypes();
      $("curriculum").addEventListener("change", refreshSubjects);
      $("generateBtn").addEventListener("click", generateContent);
      $("clearBtn").addEventListener("click", resetForm);
      $("copyBtn").addEventListener("click", copyOutput);
      $("saveBtn").addEventListener("click", saveCurrentProject);
      $("docxBtn").addEventListener("click", exportDocx);
      $("pdfBtn").addEventListener("click", printPdf);
      $("loginBtn").addEventListener("click", () => openAuth("login"));
      $("signupBtn").addEventListener("click", () => {
        if (state.user) {
          logout();
          return;
        }
        openAuth("register");
      });
      document.querySelectorAll(".tab-btn").forEach(btn => {
        btn.addEventListener("click", () => openAuth(btn.dataset.mode));
      });
      $("closeAuth").addEventListener("click", closeAuth);
      $("authForm").addEventListener("submit", handleAuthSubmit);
      $("authModal").addEventListener("click", event => {
        if (event.target === $("authModal")) closeAuth();
      });

      renderUserBadge();
      await loadSession();
      setButtonsEnabled(Boolean(state.lastResult));
    });
  </script>
</body>
</html>
